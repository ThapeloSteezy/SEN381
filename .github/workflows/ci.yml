name: CivicConnect CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CivicConnect.slnx

      # .NET analyzers (latest-recommended) run during the build; any finding fails it.
      - name: Build with static analysis
        run: dotnet build CivicConnect.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      # Unit tests use in-memory fakes; integration tests start the app against a throwaway MongoDB 8 server.
      - name: Test
        run: >
          dotnet test CivicConnect.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:TestResults/coverage -reporttypes:"MarkdownSummaryGithub;Html"
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fail on vulnerable NuGet packages
        run: |
          dotnet restore CivicConnect.slnx
          dotnet list CivicConnect.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found. Update them before merging."
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
