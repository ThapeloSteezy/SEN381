name: CivicConnect CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CivicConnect.slnx

      - name: Build
        run: dotnet build CivicConnect.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CivicConnect.slnx --configuration Release --no-build --verbosity normal
